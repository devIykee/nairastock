databases:
  - name: nairastock-db
    databaseName: nairastock
    user: nairastock
    plan: free
    region: oregon

services:
  # Redis cache
  - type: redis
    name: nairastock-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

  # NestJS API
  - type: web
    name: nairastock-api
    runtime: node
    region: oregon
    plan: free
    repo: https://github.com/devIykee/nairastock
    branch: main
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @nairastock/shared build && pnpm --filter @nairastock/api build
    startCommand: pnpm db:deploy && cd apps/api && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: nairastock-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nairastock-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CHAIN_ID
        value: 84532
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: EXPLORER_BASE_URL
        value: https://sepolia.basescan.org
      - key: FAUCET_PRIVATE_KEY
        sync: false
      - key: NETWORK_LABEL
        value: Base Sepolia
    healthCheckPath: /api/health
