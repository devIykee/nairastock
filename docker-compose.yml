# Local dev infrastructure for NairaStock.
#
# NOTE (deviation from the brief): host ports default to 5433/6380 instead of
# 5432/6379. A stock Postgres/Redis on the default ports is extremely common on
# a dev box (it was on mine), and a port clash is a confusing first-run failure.
# Both are overridable via POSTGRES_HOST_PORT / REDIS_HOST_PORT, and the
# in-network ports are unchanged (5432/6379).
services:
  postgres:
    image: postgres:16-alpine
    container_name: nairastock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nairastock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nairastock}
      POSTGRES_DB: ${POSTGRES_DB:-nairastock}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - nairastock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nairastock} -d ${POSTGRES_DB:-nairastock}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nairastock-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - nairastock-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nairastock-postgres-data:
  nairastock-redis-data:
