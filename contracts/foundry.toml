[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
# Deterministic, readable revert strings matter more than bytecode size here —
# the API surfaces them to the user verbatim ("slippage exceeded", etc.).
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
local = "${RPC_URL}"
base_sepolia = "${RPC_URL}"
